<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" role="img" aria-labelledby="title desc" font-family="'Comic Sans MS', 'Patrick Hand', 'Caveat', cursive, system-ui, sans-serif">
  <title id="title">Why resume is fast: on-demand memory restore</title>
  <desc id="desc">Side-by-side timeline. A naive eager restore loads the whole memory image before the workload can run, so the first byte waits on it. Substrate restores gVisor sandboxes with runsc restore -background -detach: the sandbox starts as soon as its state is loaded, the wakeup probe answers, and memory pages are faulted in on demand as the workload touches them. The download step is skipped entirely when the snapshot is already on the node. Micro-VMs get the same effect from Cloud Hypervisor restoring memory on demand through userfaultfd, when the Cloud Hypervisor build supports it; otherwise they restore eagerly.</desc>

  <defs>
    <filter id="sketch" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <filter id="sketch-region" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.0"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b21b6"/>
    </marker>

    <style>
      .axis      { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
      .bar-load  { fill: #fecaca; stroke: #991b1b; stroke-width: 1.6; }
      .bar-fast  { fill: #bbf7d0; stroke: #166534; stroke-width: 1.6; }
      .bar-wait  { fill: #e5e7eb; stroke: #4b5563; stroke-width: 1.6; }
      .bar-serve { fill: #fde68a; stroke: #92400e; stroke-width: 1.6; }
      .bar-page  { fill: #ddd6fe; stroke: #5b21b6; stroke-width: 1.6; }
      .tag-bad   { fill: #fee2e2; stroke: #991b1b; stroke-width: 1.4; }
      .tag-good  { fill: #dcfce7; stroke: #166534; stroke-width: 1.4; }

      .label-big   { font-size: 22px; font-weight: 700; fill: #111827; }
      .label-med   { font-size: 16px; font-weight: 700; fill: #1f2937; }
      .label-sm    { font-size: 13px; fill: #374151; }
      .label-tiny  { font-size: 11px; fill: #6b7280; }
      .region-tag  { font-size: 13px; font-weight: 700; fill: #4b5563; letter-spacing: 0.08em; }
      .annot       { font-size: 13px; fill: #374151; font-style: italic; }
      .bad         { font-size: 14px; font-weight: 700; fill: #b91c1c; }
      .good        { font-size: 14px; font-weight: 700; fill: #15803d; }
      .tick        { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 2 3; }
      .vline-bad   { stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 4 3; }
      .vline-good  { stroke: #15803d; stroke-width: 2; stroke-dasharray: 4 3; }
      .bracket     { fill: none; stroke: #15803d; stroke-width: 2.2; }
    </style>
  </defs>

  <rect width="1240" height="780" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="620" y="38" text-anchor="middle" class="label-big">The trick: restore memory on demand (runsc restore -background)</text>
  <text x="620" y="58" text-anchor="middle" class="annot">Same checkpoint. Same memory image. Different "ready to serve" point.</text>

  <!-- ============================== Region 1: NAIVE ============================== -->
  <g filter="url(#sketch-region)" opacity="0.55">
    <rect x="40" y="80" width="1160" height="220" rx="14" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6" stroke-dasharray="8 7"/>
  </g>
  <text x="60" y="104" class="region-tag">NAIVE  ·  EAGER LOAD  ·  what we DON'T do</text>

  <!-- bars -->
  <g filter="url(#sketch)">
    <rect x="120" y="140" width="200" height="40" rx="6" class="bar-load"/>
    <rect x="320" y="140" width="480" height="40" rx="6" class="bar-wait"/>
    <rect x="800" y="140" width="60"  height="40" rx="6" class="bar-fast"/>
    <rect x="860" y="140" width="50"  height="40" rx="6" class="bar-fast"/>
    <rect x="910" y="140" width="200" height="40" rx="6" class="bar-serve"/>
  </g>
  <text x="220" y="166" text-anchor="middle" class="label-sm">download + decompress</text>
  <text x="560" y="160" text-anchor="middle" class="label-sm">load the ENTIRE memory image</text>
  <text x="560" y="174" text-anchor="middle" class="label-tiny">(could be GBs - every page loaded before run)</text>
  <text x="830" y="164" text-anchor="middle" class="label-tiny">sandbox</text>
  <text x="830" y="176" text-anchor="middle" class="label-tiny">up</text>
  <text x="885" y="166" text-anchor="middle" class="label-tiny">probe</text>
  <text x="1010" y="166" text-anchor="middle" class="label-sm">handle HTTP request</text>

  <!-- time axis -->
  <line x1="120" y1="260" x2="1140" y2="260" class="axis"/>
  <text x="1148" y="265" class="label-sm">time</text>
  <line x1="120" y1="252" x2="120" y2="268" class="tick"/>
  <text x="120" y="284" text-anchor="middle" class="label-tiny">t=0</text>

  <!-- first-byte marker (naive) -->
  <line x1="910" y1="125" x2="910" y2="260" class="vline-bad"/>
  <g filter="url(#sketch)">
    <rect x="830" y="208" width="160" height="34" rx="6" class="tag-bad"/>
  </g>
  <text x="910" y="230" text-anchor="middle" class="bad">first byte: slow ⏰</text>

  <!-- ============================== GAP - savings bracket ============================== -->
  <path d="M 420 330 L 420 345 L 910 345 L 910 330" class="bracket"/>
  <text x="665" y="328" text-anchor="middle" class="good">resume latency saved</text>

  <!-- ============================== Region 2: SUBSTRATE ============================== -->
  <g filter="url(#sketch-region)" opacity="0.55">
    <rect x="40" y="370" width="1160" height="310" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="1.6" stroke-dasharray="8 7"/>
  </g>
  <text x="60" y="394" class="region-tag">SUBSTRATE  ·  runsc restore -background -detach  ·  the real path</text>

  <!-- bars -->
  <g filter="url(#sketch)">
    <!-- download + decompress (same width as naive - same network/disk cost) -->
    <rect x="120" y="450" width="200" height="40" rx="6" class="bar-load" stroke-dasharray="6 4"/>
    <!-- sandbox up -->
    <rect x="320" y="450" width="50"  height="40" rx="6" class="bar-fast"/>
    <!-- wakeup probe -->
    <rect x="370" y="450" width="50"  height="40" rx="6" class="bar-fast"/>
    <!-- handle request begins right after -->
    <rect x="420" y="450" width="200" height="40" rx="6" class="bar-serve"/>
    <!-- pages stream in below -->
    <rect x="420" y="530" width="340" height="40" rx="6" class="bar-page"/>
  </g>
  <text x="220" y="476" text-anchor="middle" class="label-sm">download + decompress</text>
  <text x="220" y="510" text-anchor="middle" class="label-tiny" fill="#991b1b">skipped entirely when the</text>
  <text x="220" y="524" text-anchor="middle" class="label-tiny" fill="#991b1b">snapshot is already on this node</text>
  <text x="395" y="476" text-anchor="middle" class="label-tiny">probe</text>
  <text x="520" y="476" text-anchor="middle" class="label-sm">handle HTTP request</text>

  <!-- sandbox-up label outside the narrow bar, with leader -->
  <line x1="345" y1="450" x2="345" y2="430" stroke="#166534" stroke-width="1.4"/>
  <text x="345" y="424" text-anchor="middle" class="label-tiny" fill="#166534">sandbox up</text>
  <text x="345" y="412" text-anchor="middle" class="label-tiny" fill="#166534">(-detach returns)</text>

  <text x="590" y="550" text-anchor="middle" class="label-sm">pages stream in on demand</text>
  <text x="590" y="564" text-anchor="middle" class="label-tiny">only the pages the workload actually touches</text>

  <!-- page-fault arrows from serve bar down to streaming bar -->
  <path d="M 460 490 L 460 530" stroke="#5b21b6" stroke-width="1.8" fill="none" marker-end="url(#arrow-pg)"/>
  <path d="M 510 490 L 510 530" stroke="#5b21b6" stroke-width="1.8" fill="none" marker-end="url(#arrow-pg)"/>
  <path d="M 560 490 L 560 530" stroke="#5b21b6" stroke-width="1.8" fill="none" marker-end="url(#arrow-pg)"/>
  <text x="640" y="514" class="label-tiny" fill="#5b21b6">page fault</text>
  <text x="640" y="527" class="label-tiny" fill="#5b21b6">→ fetch page</text>

  <!-- time axis -->
  <line x1="120" y1="640" x2="1140" y2="640" class="axis"/>
  <text x="1148" y="645" class="label-sm">time</text>
  <line x1="120" y1="632" x2="120" y2="648" class="tick"/>
  <text x="120" y="664" text-anchor="middle" class="label-tiny">t=0</text>

  <!-- first-byte marker (substrate) -->
  <line x1="420" y1="350" x2="420" y2="372" class="vline-good"/>
  <line x1="420" y1="402" x2="420" y2="640" class="vline-good"/>
  <g filter="url(#sketch)">
    <rect x="336" y="600" width="168" height="34" rx="6" class="tag-good"/>
  </g>
  <text x="420" y="622" text-anchor="middle" class="good">first byte: fast 🚀</text>

  <!-- naive first-byte vertical extended down into substrate region as comparison line -->
  <line x1="910" y1="350" x2="910" y2="640" class="vline-bad"/>
  <text x="910" y="664" text-anchor="middle" class="label-tiny" fill="#b91c1c">(naive would still be loading the memory image here)</text>

  <!-- flag legend - one line, never overflows. -->
  <g filter="url(#sketch)">
    <rect x="40" y="700" width="1160" height="44" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  </g>
  <text x="70" y="727" class="label-sm">
    <tspan font-weight="700" fill="#5b21b6">-background</tspan>
    <tspan>  restore memory on demand   ·   </tspan>
    <tspan font-weight="700" fill="#5b21b6">-detach</tspan>
    <tspan>  return once the sandbox is up   ·   </tspan>
    <tspan font-weight="700" fill="#5b21b6">micro-VMs</tspan>
    <tspan>  Cloud Hypervisor demand-pages via userfaultfd when its build allows</tspan>
  </text>

</svg>
