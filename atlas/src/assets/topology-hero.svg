<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc" font-family="'Comic Sans MS', 'Patrick Hand', 'Caveat', cursive, system-ui, sans-serif">
  <title id="title">Substrate topology — whiteboard view</title>
  <desc id="desc">Client connects to atenet, which routes via ateapi to a worker pod; atelet ships snapshots to GCS/S3.</desc>

  <!-- Hand-drawn sketch filter: subtle wobble on all strokes -->
  <defs>
    <filter id="sketch" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
    </filter>
    <filter id="sketch2" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3b3b"/>
    </marker>

    <style>
      .box  { fill: #fffbe6; stroke: #2c2c2c; stroke-width: 2.2; }
      .box-cp { fill: #e7f1ff; stroke: #1e3a8a; stroke-width: 2.2; }
      .box-dp { fill: #e9f7e7; stroke: #166534; stroke-width: 2.2; }
      .box-st { fill: #fde2e2; stroke: #991b1b; stroke-width: 2.2; }
      .box-cl { fill: #f3e8ff; stroke: #581c87; stroke-width: 2.2; }
      .label-big   { font-size: 19px; font-weight: 700; fill: #1f2937; }
      .label-sm    { font-size: 13px; fill: #374151; }
      .label-tiny  { font-size: 11px; fill: #6b7280; }
      .group-label { font-size: 13px; font-weight: 700; fill: #6b7280; letter-spacing: 0.04em; }
      .conn        { fill: none; stroke: #3b3b3b; stroke-width: 2.2; marker-end: url(#arrow); }
      .conn-bi     { fill: none; stroke: #3b3b3b; stroke-width: 2.2; marker-end: url(#arrow); marker-start: url(#arrow); }
      .conn-dot    { stroke-dasharray: 5 4; }
      .annot       { font-size: 12px; fill: #4b5563; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="520" fill="#fdfcf7"/>

  <!-- ==== GROUP REGIONS ==== -->
  <!-- Control plane region -->
  <g filter="url(#sketch2)" opacity="0.55">
    <rect x="320" y="40"  width="350" height="170" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>
  <text x="335" y="60" class="group-label">CONTROL PLANE</text>

  <!-- Data plane region -->
  <g filter="url(#sketch2)" opacity="0.55">
    <rect x="320" y="290" width="350" height="200" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>
  <text x="335" y="310" class="group-label">DATA PLANE  (per worker node)</text>

  <!-- ==== BOXES ==== -->

  <!-- Client -->
  <g filter="url(#sketch)">
    <rect x="30" y="225" width="130" height="70" rx="10" class="box-cl"/>
  </g>
  <text x="95" y="260" text-anchor="middle" class="label-big">Client</text>
  <text x="95" y="278" text-anchor="middle" class="label-sm">HTTP / DNS</text>

  <!-- atenet -->
  <g filter="url(#sketch)">
    <rect x="195" y="215" width="100" height="90" rx="10" class="box"/>
  </g>
  <text x="245" y="248" text-anchor="middle" class="label-big">atenet</text>
  <text x="245" y="268" text-anchor="middle" class="label-sm">Envoy + DNS</text>
  <text x="245" y="286" text-anchor="middle" class="label-tiny">ExtProc, xDS</text>

  <!-- ateapi -->
  <g filter="url(#sketch)">
    <rect x="350" y="80" width="135" height="80" rx="10" class="box-cp"/>
  </g>
  <text x="417" y="112" text-anchor="middle" class="label-big">ateapi</text>
  <text x="417" y="132" text-anchor="middle" class="label-sm">gRPC + workflows</text>

  <!-- atecontroller -->
  <g filter="url(#sketch)">
    <rect x="510" y="80" width="140" height="80" rx="10" class="box-cp"/>
  </g>
  <text x="580" y="112" text-anchor="middle" class="label-big">atecontroller</text>
  <text x="580" y="132" text-anchor="middle" class="label-sm">CRD reconciler</text>

  <!-- Redis -->
  <g filter="url(#sketch)">
    <rect x="350" y="170" width="135" height="38" rx="10" class="box-cp"/>
  </g>
  <text x="417" y="195" text-anchor="middle" class="label-sm" font-weight="700">Redis / Valkey</text>

  <!-- atelet -->
  <g filter="url(#sketch)">
    <rect x="350" y="330" width="135" height="60" rx="10" class="box-dp"/>
  </g>
  <text x="417" y="358" text-anchor="middle" class="label-big">atelet</text>
  <text x="417" y="376" text-anchor="middle" class="label-sm">DaemonSet</text>

  <!-- Worker pod (with ateom-gvisor inside) -->
  <g filter="url(#sketch)">
    <rect x="350" y="400" width="300" height="76" rx="10" class="box-dp"/>
  </g>
  <text x="500" y="428" text-anchor="middle" class="label-big">Worker pod  (gVisor)</text>
  <text x="500" y="448" text-anchor="middle" class="label-sm">ateom-gvisor  ·  runsc  ·  workload</text>
  <text x="500" y="466" text-anchor="middle" class="label-tiny">checkpoint / restore over Unix socket</text>

  <!-- Worker pod sibling (just visually suggest a pool) -->
  <g filter="url(#sketch)" opacity="0.45">
    <rect x="362" y="384" width="280" height="12" rx="4" class="box-dp"/>
  </g>
  <g filter="url(#sketch)" opacity="0.7">
    <rect x="356" y="372" width="292" height="14" rx="6" class="box-dp"/>
  </g>

  <!-- Storage -->
  <g filter="url(#sketch)">
    <rect x="745" y="385" width="140" height="80" rx="14" class="box-st"/>
  </g>
  <text x="815" y="420" text-anchor="middle" class="label-big">GCS / S3</text>
  <text x="815" y="440" text-anchor="middle" class="label-sm">checkpoint snapshots</text>
  <text x="815" y="456" text-anchor="middle" class="label-tiny">(zstd-compressed)</text>

  <!-- ==== CONNECTIONS ==== -->

  <!-- Client ↔ atenet -->
  <path d="M 160 260 L 192 260" class="conn"/>
  <text x="178" y="252" text-anchor="middle" class="annot">HTTP</text>

  <!-- atenet → ateapi  (ResumeActor per request) -->
  <path d="M 296 240 C 320 210, 335 165, 350 130" class="conn"/>
  <text x="320" y="180" class="annot">ResumeActor</text>

  <!-- atenet → worker (HTTP forward) -->
  <path d="M 296 280 C 320 320, 335 380, 350 432" class="conn"/>
  <text x="298" y="345" class="annot">HTTP →</text>

  <!-- ateapi ↔ Redis -->
  <path d="M 417 160 L 417 170" class="conn-bi"/>

  <!-- ateapi → atelet (Checkpoint / Restore / Run) -->
  <path d="M 417 208 L 417 330" class="conn"/>
  <text x="425" y="270" class="annot">Checkpoint / Restore</text>

  <!-- atelet → worker pod (Unix socket to ateom) -->
  <path d="M 417 390 L 417 400" class="conn"/>

  <!-- atelet ↔ GCS -->
  <path d="M 485 360 C 600 360, 700 400, 745 412" class="conn-bi"/>
  <text x="600" y="350" class="annot">upload / download (zstd)</text>

  <!-- atecontroller → K8s API (implied) -->
  <path d="M 580 160 L 580 200" class="conn conn-dot"/>
  <text x="588" y="186" class="annot">reconciles CRDs (K8s API)</text>
</svg>
