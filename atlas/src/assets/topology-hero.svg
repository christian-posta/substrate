<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc" font-family="'Comic Sans MS', 'Patrick Hand', 'Caveat', cursive, system-ui, sans-serif">
  <title id="title">Substrate topology - whiteboard view</title>
  <desc id="desc">Client connects to atenet, which consults ateapi (control plane) to find the right worker pod. atelet uploads and downloads snapshots between the worker pod and GCS/S3.</desc>

  <defs>
    <filter id="sketch" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <filter id="sketch-region" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.0"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>

    <style>
      .box-cl   { fill: #f3e8ff; stroke: #4c1d95; stroke-width: 2.4; }
      .box-gw   { fill: #fffbe6; stroke: #92400e; stroke-width: 2.4; }
      .box-cp   { fill: #dbeafe; stroke: #1e3a8a; stroke-width: 2.4; }
      .box-dp   { fill: #dcfce7; stroke: #166534; stroke-width: 2.4; }
      .box-st   { fill: #fee2e2; stroke: #991b1b; stroke-width: 2.4; }
      .box-sub  { fill: #ffffff; stroke: #166534; stroke-width: 1.6; }

      .label-big   { font-size: 23px; font-weight: 700; fill: #111827; }
      .label-med   { font-size: 17px; font-weight: 700; fill: #1f2937; }
      .label-sm    { font-size: 14px; fill: #374151; }
      .label-tiny  { font-size: 12px; fill: #6b7280; }
      .region-tag  { font-size: 13px; font-weight: 700; fill: #4b5563; letter-spacing: 0.08em; }

      .conn     { fill: none; stroke: #1f2937; stroke-width: 2.4; marker-end: url(#arrow); }
      .conn-bi  { fill: none; stroke: #1f2937; stroke-width: 2.4; marker-end: url(#arrow); marker-start: url(#arrow); }
      .conn-dot { stroke-dasharray: 6 5; }
      .annot    { font-size: 14px; fill: #374151; font-style: italic; }

      /* Clickable boxes - show pointer + slight brightening on hover. */
      a, a * { cursor: pointer; }
      a:focus { outline: none; }
      a:hover rect { stroke-width: 3.6; filter: brightness(1.04); }
      a:hover text { fill: #000; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1240" height="820" fill="#fdfcf7"/>

  <!-- ============================== REGIONS ============================== -->
  <!-- Control plane region (right, top) -->
  <g filter="url(#sketch-region)" opacity="0.55">
    <rect x="490" y="60" width="720" height="240" rx="18" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6" stroke-dasharray="8 7"/>
  </g>
  <text x="510" y="86" class="region-tag">CONTROL PLANE</text>

  <!-- Data plane region (right, middle) -->
  <g filter="url(#sketch-region)" opacity="0.55">
    <rect x="490" y="370" width="720" height="220" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="1.6" stroke-dasharray="8 7"/>
  </g>
  <text x="510" y="396" class="region-tag">DATA PLANE  ·  per worker node</text>

  <!-- Storage region (right, bottom) -->
  <g filter="url(#sketch-region)" opacity="0.55">
    <rect x="490" y="650" width="720" height="140" rx="18" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6" stroke-dasharray="8 7"/>
  </g>
  <text x="510" y="676" class="region-tag">SNAPSHOT STORAGE</text>

  <!-- ============================== BOXES =============================== -->

  <!-- Client -->
  <g filter="url(#sketch)">
    <rect x="40" y="400" width="170" height="110" rx="14" class="box-cl"/>
  </g>
  <text x="125" y="444" text-anchor="middle" class="label-big">Client</text>
  <text x="125" y="470" text-anchor="middle" class="label-sm">HTTP request</text>
  <text x="125" y="492" text-anchor="middle" class="label-tiny">actorId.actors…ate.dev</text>

  <!-- atenet (gateway) -->
  <a href="/components/atenet/">
    <g filter="url(#sketch)">
      <rect x="260" y="400" width="170" height="110" rx="14" class="box-gw"/>
    </g>
    <text x="345" y="440" text-anchor="middle" class="label-big">atenet</text>
    <text x="345" y="464" text-anchor="middle" class="label-sm">L7 proxy + DNS</text>
    <text x="345" y="486" text-anchor="middle" class="label-tiny">ExtProc · xDS</text>
  </a>

  <!-- ateapi -->
  <a href="/components/ateapi/">
    <g filter="url(#sketch)">
      <rect x="520" y="110" width="180" height="120" rx="14" class="box-cp"/>
    </g>
    <text x="610" y="152" text-anchor="middle" class="label-big">ateapi</text>
    <text x="610" y="180" text-anchor="middle" class="label-sm">gRPC + workflows</text>
    <text x="610" y="202" text-anchor="middle" class="label-tiny">source of truth</text>
  </a>

  <!-- Redis (attached right of ateapi) -->
  <a href="/components/storage/">
    <g filter="url(#sketch)">
      <rect x="730" y="110" width="120" height="120" rx="14" class="box-cp"/>
    </g>
    <text x="790" y="152" text-anchor="middle" class="label-med">Redis</text>
    <text x="790" y="178" text-anchor="middle" class="label-tiny">actors</text>
    <text x="790" y="196" text-anchor="middle" class="label-tiny">workers</text>
    <text x="790" y="214" text-anchor="middle" class="label-tiny">locks</text>
  </a>

  <!-- atecontroller (right of Redis) -->
  <a href="/components/atecontroller/">
    <g filter="url(#sketch)">
      <rect x="880" y="110" width="220" height="120" rx="14" class="box-cp"/>
    </g>
    <text x="990" y="152" text-anchor="middle" class="label-big">atecontroller</text>
    <text x="990" y="180" text-anchor="middle" class="label-sm">CRD reconciler</text>
    <text x="990" y="202" text-anchor="middle" class="label-tiny">WorkerPool · ActorTemplate</text>
  </a>

  <!-- atelet -->
  <a href="/components/atelet/">
    <g filter="url(#sketch)">
      <rect x="520" y="420" width="180" height="120" rx="14" class="box-dp"/>
    </g>
    <text x="610" y="464" text-anchor="middle" class="label-big">atelet</text>
    <text x="610" y="490" text-anchor="middle" class="label-sm">DaemonSet</text>
    <text x="610" y="512" text-anchor="middle" class="label-tiny">drives ateom · ships snapshots</text>
  </a>

  <!-- Worker pod (outer shell linked to /components/workers/) -->
  <a href="/components/workers/">
    <g filter="url(#sketch)">
      <rect x="730" y="410" width="380" height="160" rx="14" class="box-dp"/>
    </g>
    <text x="920" y="442" text-anchor="middle" class="label-big">Worker pod  ·  gVisor</text>
    <text x="920" y="552" text-anchor="middle" class="label-tiny" fill="#6b7280">one actor per pod · pool of N pods</text>
  </a>

  <!-- Worker pod sub-boxes - each linked to its own component page -->
  <a href="/components/ateom-gvisor/">
    <g filter="url(#sketch)">
      <rect x="750" y="460" width="140" height="56" rx="8" class="box-sub"/>
    </g>
    <text x="820" y="484" text-anchor="middle" class="label-sm" font-weight="700">ateom-gvisor</text>
    <text x="820" y="503" text-anchor="middle" class="label-tiny">Unix socket gRPC</text>
  </a>
  <a href="/components/ateom-gvisor/">
    <g filter="url(#sketch)">
      <rect x="900" y="460" width="90" height="56" rx="8" class="box-sub"/>
    </g>
    <text x="945" y="484" text-anchor="middle" class="label-sm" font-weight="700">runsc</text>
    <text x="945" y="503" text-anchor="middle" class="label-tiny">gVisor</text>
  </a>
  <a href="/components/workers/">
    <g filter="url(#sketch)">
      <rect x="1000" y="460" width="95" height="56" rx="8" class="box-sub"/>
    </g>
    <text x="1047" y="484" text-anchor="middle" class="label-sm" font-weight="700">workload</text>
    <text x="1047" y="503" text-anchor="middle" class="label-tiny">your code</text>
  </a>

  <!-- GCS / S3 -->
  <a href="/components/storage/">
    <g filter="url(#sketch)">
      <rect x="520" y="690" width="180" height="80" rx="14" class="box-st"/>
    </g>
    <text x="610" y="722" text-anchor="middle" class="label-big">GCS / S3</text>
    <text x="610" y="745" text-anchor="middle" class="label-sm">checkpoint snapshots</text>
    <text x="610" y="762" text-anchor="middle" class="label-tiny">zstd-compressed</text>
  </a>

  <!-- ============================== ARROWS ============================== -->

  <!-- 1. Client → atenet -->
  <path d="M 210 455 L 256 455" class="conn"/>
  <text x="233" y="445" text-anchor="middle" class="annot">HTTP</text>

  <!-- 2. atenet → ateapi (ResumeActor) -->
  <path d="M 430 425 C 470 320, 490 240, 520 218" class="conn"/>
  <text x="438" y="320" class="annot">ResumeActor</text>
  <text x="438" y="338" class="annot">(per request)</text>

  <!-- 3. atenet → worker pod (HTTP after :authority rewrite).
       L-shape: down from atenet bottom, across BELOW atelet, up into worker pod.
       Keeps the horizontal segment in the clear gap between DP and Storage regions. -->
  <path d="M 345 510 L 345 618 L 718 618 L 730 568" class="conn"/>
  <text x="476" y="606" text-anchor="middle" class="annot">HTTP after :authority rewrite</text>

  <!-- 4. ateapi ↔ Redis -->
  <path d="M 700 170 L 730 170" class="conn-bi"/>

  <!-- 5. ateapi → atelet -->
  <path d="M 610 230 L 610 416" class="conn"/>
  <text x="622" y="340" class="annot">Run · Checkpoint · Restore</text>

  <!-- 6. atelet → worker pod (drives ateom) -->
  <path d="M 700 480 L 730 480" class="conn"/>

  <!-- 7. atelet ↔ GCS/S3 -->
  <path d="M 610 540 L 610 690" class="conn-bi"/>
  <text x="622" y="618" class="annot">upload /</text>
  <text x="622" y="636" class="annot">download</text>
  <text x="622" y="654" class="annot">(zstd)</text>

</svg>
