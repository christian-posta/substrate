<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc" font-family="'Comic Sans MS', 'Patrick Hand', 'Caveat', cursive, system-ui, sans-serif">
  <title id="title">Substrate topology - whiteboard view</title>
  <desc id="desc">A client sends a request to atenet-router naming the actor in the ate-target-actor header. The router asks ate-api-server, backed by PostgreSQL, to resume the actor, then tunnels the request over mTLS CONNECT to atunnel in the worker pod. atelet drives the ateworker and moves snapshots to GCS or S3 through its objectstore-plugin. Outbound traffic leaves through atunnel and the atenet-egress gateway.</desc>

  <defs>
    <filter id="sketch" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <filter id="sketch-region" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.0"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>

    <style>
      .box-cl   { fill: #f3e8ff; stroke: #4c1d95; stroke-width: 2.4; }
      .box-gw   { fill: #fffbe6; stroke: #92400e; stroke-width: 2.4; }
      .box-cp   { fill: #dbeafe; stroke: #1e3a8a; stroke-width: 2.4; }
      .box-dp   { fill: #dcfce7; stroke: #166534; stroke-width: 2.4; }
      .box-st   { fill: #fee2e2; stroke: #991b1b; stroke-width: 2.4; }
      .box-sub  { fill: #ffffff; stroke: #166534; stroke-width: 1.6; }

      .label-big   { font-size: 23px; font-weight: 700; fill: #111827; }
      .label-med   { font-size: 17px; font-weight: 700; fill: #1f2937; }
      .label-sm    { font-size: 14px; fill: #374151; }
      .label-tiny  { font-size: 12px; fill: #6b7280; }
      .region-tag  { font-size: 13px; font-weight: 700; fill: #4b5563; letter-spacing: 0.08em; }

      .conn     { fill: none; stroke: #1f2937; stroke-width: 2.4; marker-end: url(#arrow); }
      .conn-bi  { fill: none; stroke: #1f2937; stroke-width: 2.4; marker-end: url(#arrow); marker-start: url(#arrow); }
      .conn-dot { stroke-dasharray: 6 5; }
      .annot    { font-size: 14px; fill: #374151; font-style: italic; }

      /* Clickable boxes - show pointer + slight brightening on hover. */
      a, a * { cursor: pointer; }
      a:focus { outline: none; }
      a:hover rect { stroke-width: 3.6; filter: brightness(1.04); }
      a:hover text { fill: #000; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1240" height="820" fill="#fdfcf7"/>

  <!-- ============================== REGIONS ============================== -->
  <!-- Control plane region (right, top) -->
  <g filter="url(#sketch-region)" opacity="0.55">
    <rect x="490" y="60" width="720" height="240" rx="18" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.6" stroke-dasharray="8 7"/>
  </g>
  <text x="510" y="86" class="region-tag">CONTROL PLANE</text>

  <!-- Data plane region (right, middle) -->
  <g filter="url(#sketch-region)" opacity="0.55">
    <rect x="490" y="370" width="720" height="220" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="1.6" stroke-dasharray="8 7"/>
  </g>
  <text x="510" y="396" class="region-tag">DATA PLANE  ·  per worker node</text>

  <!-- Storage region (bottom, left half) -->
  <g filter="url(#sketch-region)" opacity="0.55">
    <rect x="490" y="650" width="280" height="140" rx="18" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6" stroke-dasharray="8 7"/>
  </g>
  <text x="510" y="676" class="region-tag">SNAPSHOT STORAGE</text>

  <!-- Egress region (bottom, right half) -->
  <g filter="url(#sketch-region)" opacity="0.55">
    <rect x="790" y="650" width="420" height="140" rx="18" fill="#fffbe6" stroke="#92400e" stroke-width="1.6" stroke-dasharray="8 7"/>
  </g>
  <text x="810" y="676" class="region-tag">EGRESS</text>

  <!-- ============================== BOXES =============================== -->

  <!-- Client -->
  <g filter="url(#sketch)">
    <rect x="40" y="400" width="170" height="110" rx="14" class="box-cl"/>
  </g>
  <text x="125" y="444" text-anchor="middle" class="label-big">Client</text>
  <text x="125" y="470" text-anchor="middle" class="label-sm">HTTP request</text>
  <text x="125" y="492" text-anchor="middle" class="label-tiny">ate-target-actor header</text>

  <!-- atenet-router (ingress gateway) -->
  <a href="/components/atenet/">
    <g filter="url(#sketch)">
      <rect x="245" y="400" width="200" height="110" rx="14" class="box-gw"/>
    </g>
    <text x="345" y="438" text-anchor="middle" class="label-med">atenet-router</text>
    <text x="345" y="462" text-anchor="middle" class="label-sm">AgentGateway (preferred)</text>
    <text x="345" y="482" text-anchor="middle" class="label-tiny">or Envoy (install default)</text>
    <text x="345" y="499" text-anchor="middle" class="label-tiny">parks requests during resume</text>
  </a>

  <!-- ate-api-server -->
  <a href="/components/ateapi/">
    <g filter="url(#sketch)">
      <rect x="510" y="110" width="200" height="120" rx="14" class="box-cp"/>
    </g>
    <text x="610" y="152" text-anchor="middle" class="label-med">ate-api-server</text>
    <text x="610" y="178" text-anchor="middle" class="label-sm">gRPC + workflows</text>
    <text x="610" y="200" text-anchor="middle" class="label-tiny">placement · golden snapshots</text>
  </a>

  <!-- PostgreSQL -->
  <a href="/components/storage/">
    <g filter="url(#sketch)">
      <rect x="730" y="110" width="160" height="120" rx="14" class="box-cp"/>
    </g>
    <text x="810" y="150" text-anchor="middle" class="label-med">PostgreSQL</text>
    <text x="810" y="174" text-anchor="middle" class="label-tiny">atespaces · templates</text>
    <text x="810" y="192" text-anchor="middle" class="label-tiny">actors · workers · tags</text>
    <text x="810" y="210" text-anchor="middle" class="label-tiny">leases</text>
  </a>

  <!-- ate-controller -->
  <a href="/components/atecontroller/">
    <g filter="url(#sketch)">
      <rect x="905" y="110" width="200" height="120" rx="14" class="box-cp"/>
    </g>
    <text x="1005" y="152" text-anchor="middle" class="label-med">ate-controller</text>
    <text x="1005" y="178" text-anchor="middle" class="label-sm">WorkerPool → worker pods</text>
    <text x="1005" y="200" text-anchor="middle" class="label-tiny">worker syncer · SandboxConfig</text>
  </a>

  <!-- atelet -->
  <a href="/components/atelet/">
    <g filter="url(#sketch)">
      <rect x="520" y="420" width="180" height="120" rx="14" class="box-dp"/>
    </g>
    <text x="610" y="462" text-anchor="middle" class="label-big">atelet</text>
    <text x="610" y="488" text-anchor="middle" class="label-sm">DaemonSet</text>
    <text x="610" y="510" text-anchor="middle" class="label-tiny">drives the worker</text>
  </a>

  <!-- Worker pod (outer shell linked to /components/workers/) -->
  <a href="/components/workers/">
    <g filter="url(#sketch)">
      <rect x="730" y="410" width="380" height="160" rx="14" class="box-dp"/>
    </g>
    <text x="920" y="442" text-anchor="middle" class="label-big">Worker pod  ·  gVisor</text>
    <text x="745" y="552" class="label-tiny" fill="#6b7280">pool of N pods</text>
  </a>

  <!-- Worker pod sub-boxes - each linked to its own page -->
  <a href="/components/ateworker-gvisor/">
    <g filter="url(#sketch)">
      <rect x="745" y="460" width="120" height="56" rx="8" class="box-sub"/>
    </g>
    <text x="805" y="484" text-anchor="middle" class="label-sm" font-weight="700">ateworker</text>
    <text x="805" y="503" text-anchor="middle" class="label-tiny">drives runsc</text>
  </a>
  <a href="/components/atenet/">
    <g filter="url(#sketch)">
      <rect x="875" y="460" width="100" height="56" rx="8" class="box-sub"/>
    </g>
    <text x="925" y="484" text-anchor="middle" class="label-sm" font-weight="700">atunnel</text>
    <text x="925" y="503" text-anchor="middle" class="label-tiny">in / out</text>
  </a>
  <a href="/concepts/actor/">
    <g filter="url(#sketch)">
      <rect x="985" y="460" width="110" height="56" rx="8" class="box-sub"/>
    </g>
    <text x="1040" y="484" text-anchor="middle" class="label-sm" font-weight="700">actors × N</text>
    <text x="1040" y="503" text-anchor="middle" class="label-tiny">one sandbox each</text>
  </a>

  <!-- GCS / S3 -->
  <a href="/components/storage/">
    <g filter="url(#sketch)">
      <rect x="520" y="690" width="180" height="80" rx="14" class="box-st"/>
    </g>
    <text x="610" y="722" text-anchor="middle" class="label-big">GCS / S3</text>
    <text x="610" y="745" text-anchor="middle" class="label-sm">actor snapshots</text>
    <text x="610" y="762" text-anchor="middle" class="label-tiny">zstd-compressed</text>
  </a>

  <!-- atenet-egress -->
  <a href="/components/atenet/">
    <g filter="url(#sketch)">
      <rect x="815" y="690" width="180" height="80" rx="14" class="box-gw"/>
    </g>
    <text x="905" y="720" text-anchor="middle" class="label-med">atenet-egress</text>
    <text x="905" y="742" text-anchor="middle" class="label-sm">policy · credentials</text>
    <text x="905" y="760" text-anchor="middle" class="label-tiny">AgentGateway or Envoy</text>
  </a>

  <!-- External destination -->
  <g filter="url(#sketch)">
    <rect x="1030" y="690" width="160" height="80" rx="14" class="box-cl"/>
  </g>
  <text x="1110" y="724" text-anchor="middle" class="label-med">External APIs</text>
  <text x="1110" y="748" text-anchor="middle" class="label-tiny">what the actor dials</text>

  <!-- ============================== ARROWS ============================== -->

  <!-- 1. Client → atenet-router -->
  <path d="M 210 455 L 241 455" class="conn"/>

  <!-- 2. atenet-router → ate-api-server (ResumeActor) -->
  <path d="M 445 425 C 480 320, 495 240, 510 218" class="conn"/>
  <text x="462" y="320" text-anchor="end" class="annot">ResumeActor</text>
  <text x="462" y="338" text-anchor="end" class="annot">(AgentGateway caches it)</text>

  <!-- 3. atenet-router → atunnel (mTLS CONNECT).
       L-shape: down from the router, across BELOW atelet, up into atunnel.
       Keeps the horizontal segment in the gap between the data plane and the
       bottom regions. -->
  <path d="M 345 510 L 345 618 L 900 618 L 900 520" class="conn"/>
  <text x="476" y="606" text-anchor="middle" class="annot">mTLS CONNECT → atunnel</text>

  <!-- 4. ate-api-server ↔ PostgreSQL -->
  <path d="M 710 170 L 730 170" class="conn-bi"/>

  <!-- 5. ate-api-server → atelet -->
  <path d="M 610 230 L 610 416" class="conn"/>
  <text x="622" y="340" class="annot">Run · Checkpoint · Restore</text>

  <!-- 6. atelet → worker pod (drives ateworker over worker.sock) -->
  <path d="M 700 488 L 741 488" class="conn"/>

  <!-- 7. atelet ↔ GCS/S3 through the objectstore-plugin sidecar -->
  <path d="M 610 540 L 610 690" class="conn-bi"/>
  <text x="622" y="582" class="annot">via objectstore-plugin</text>

  <!-- 8. atunnel → atenet-egress (actor egress) -->
  <path d="M 950 520 L 950 686" class="conn"/>
  <text x="962" y="640" class="annot">worker-for-actor</text>
  <text x="962" y="658" class="annot">mTLS CONNECT</text>

  <!-- 9. atenet-egress → external destination -->
  <path d="M 995 730 L 1026 730" class="conn"/>

</svg>
